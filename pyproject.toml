[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphanexus"
version = "2.0.0"
description = "ALPHANEXUS: AI-Powered Financial Intelligence & Equity Research Platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
    { name = "ALPHANEXUS Architecture Team", email = "engineering@alphanexus.ai" }
]
keywords = [
    "finance",
    "equity-research",
    "rag",
    "langchain",
    "mongodb-atlas",
    "fastapi",
    "streamlit",
    "nse",
    "bse"
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.5",
    "pymongo>=4.9.0",
    "certifi>=2024.8.30",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-mongodb>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "sentence-transformers>=3.1.0",
    "torch>=2.2.0",
    "google-generativeai>=0.8.0",
    "groq>=0.11.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "statsmodels>=0.14.0",
    "xgboost>=2.1.0",
    "rank-bm25>=0.2.2",
    "pdfplumber>=0.11.0",
    "pypdf>=4.3.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.2",
    "streamlit>=1.39.0",
    "plotly>=5.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "black>=24.8.0"
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
